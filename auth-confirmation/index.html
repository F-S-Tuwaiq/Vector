</style></head><body><main><small>VECTOR</small><h1 id="title">Return to Vector</h1><p id="message">If you just confirmed your email, return to the Vector app to finish signing up.</p><p class="step">In the app, tap <strong>I've confirmed my email</strong>. Vector will securely check your confirmation and finish saving your account.</p></main><script>
const query = new URLSearchParams(location.search);

// Remove authentication parameters before any further navigation. No analytics,

history.replaceState(null, '', location.pathname);
if (failed) { document.getElementById('title').textContent='This link could not be used'; document.getElementById('message').textContent='It may have expired or already been used. Return to Vector and check your confirmation first. Request another email only if the app says your email is still unconfirmed.'; }
</script></body></html>
