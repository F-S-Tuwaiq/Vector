name: vector
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.2.1
  supabase_flutter: ^2.17.2

dev_dependencies:
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
          weight: 600
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

  assets:
    - assets/logo/saudi-made.png
    - .env
    - assets/logo/vector-app-icon-1024.png
    - assets/logo/vector-mark-dark-1024-removebg-preview.png
